baseURL = "https://dat.works/"
languageCode = "en-us"
title = "Dat Nguyen"
theme = "paper"
enableEmoji = true

# Only `tag` — `categories` was a second taxonomy doing the same job.
# Controlled vocabulary, deliberately small. Adding a tag outside this list is
# how you end up with 30 single-use tags, which is the same as having none:
#   software · ml · money · books · attention · travel · life
[taxonomies]
  tag = "tags"

# Tag-based "related posts" — the cheap 80% of a graph view, with none of the
# machinery. Improves on its own as tagged posts accumulate.
[related]
  includeNewer = true
  threshold = 60
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "date"
    weight = 10

# Date-prefixed directories are for ordering source files, not for URLs.
[permalinks]
  posts = "/writing/:slug/"

[params]
  color = 'linen'
  # Rendered as the icon row in the header. Order is fixed by the theme:
  # twitter, github, instagram, linkedin, mastodon, rss.
  # The theme renders linkedin as https://linkedin.com/in/<handle>.
  twitter = 'datfreedom'
  github = 'datlife'
  linkedin = 'datwork'
  name = 'Dat Nguyen'
  author = 'Dat Nguyen'
  description = 'Machine-learning engineer in the Bay Area. I write about building software and ML systems, and occasionally about money, attention, and the things I have changed my mind about.'
  bio = 'A good investment is something you have control over.'
  images = ['og.jpg']
  mainSections = ['posts']
# ------------------------------

# needed to  render raw HTML (e.g. <sub>, <sup>, <kbd>, <mark>)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
#  [markup.highlight]
#    lineNos = true

# Two items. A nav entry is a maintenance commitment, not a statement of intent.
[menu]
  [[menu.main]]
    identifier = "writing"
    name = "writing"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "about"
    name = "about"
    url = "/about/"
    weight = 2

[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true
  [privacy.x]
    enableDNT = true
    simple = true
  [privacy.instagram]
    disabled = false
    simple = true
  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]
  [services.instagram]
    disableInlineCSS = true
  [services.x]
    disableInlineCSS = true

[imaging]
# Default resample filter used for resizing. Default is Box,
# a simple and fast averaging filter appropriate for downscaling.
# See https://github.com/disintegration/imaging
resampleFilter = "box"

# Default JPEG quality setting. Default is 75.
quality = 75

# Anchor used when cropping pictures.
# Default is "smart" which does Smart Cropping, using https://github.com/muesli/smartcrop
# Smart Cropping is content aware and tries to find the best crop for each image.
# Valid values are Smart, Center, TopLeft, Top, TopRight, Left, Right, BottomLeft, Bottom, BottomRight
anchor = "smart"

# Default background color. 
# Hugo will preserve transparency for target formats that supports it,
# but will fall back to this color for JPEG.
# Expects a standard HEX color string with 3 or 6 digits.
# See https://www.google.com/search?q=color+picker
bgColor = "#ffffff"

[imaging.exif]
 # Regexp matching the fields you want to Exclude from the (massive) set of Exif info
# available. As we cache this info to disk, this is for performance and
# disk space reasons more than anything.
# If you want it all, put ".*" in this config setting.
# Note that if neither this or ExcludeFields is set, Hugo will return a small
# default set.
includeFields = ""

# Regexp matching the Exif fields you want to exclude. This may be easier to use
# than IncludeFields above, depending on what you want.
excludeFields = ""

# Hugo extracts the "photo taken" date/time into .Date by default.
# Set this to true to turn it off.
disableDate = false

# Hugo extracts the "photo taken where" (GPS latitude and longitude) into
# .Long and .Lat. Set this to true to turn it off.
disableLatLong = false